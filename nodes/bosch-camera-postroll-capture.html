<script type="text/javascript">
    RED.nodes.registerType('bosch-camera-postroll-capture', {
        category: 'Bosch Camera',
        color: '#a6bbcf',
        defaults: {
            name:           { value: '' },
            server:         { value: '', type: 'bosch-camera-config', required: true },
            cameraId:       { value: '', required: false },
            connectionType: { value: 'LOCAL' },  // 'LOCAL' | 'REMOTE'
            quality:        { value: 'auto' },   // 'auto' | 'high' | 'low'
            outputDir:      { value: '', required: true },
            seconds:        { value: 10, validate: RED.validators.number() },
            ffmpegPath:     { value: 'ffmpeg' },
            stopGraceMs:    { value: 5000, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 1,
        icon: 'camera.svg',
        label: function () {
            return this.name || 'bosch postroll capture';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        }
    });
</script>

<script type="text/html" data-help-name="bosch-camera-postroll-capture">
    <p>Bounded, one-shot local capture: on an incoming message, opens the camera's
    local RTSP/RTSPS stream and captures <b>N seconds starting now</b> to a single
    <code>.mp4</code> file via <code>ffmpeg</code> (<code>-c copy</code>, no re-encode),
    then emits the file path once the capture has finished.</p>

    <p><b>Not the sibling HA integration's ring-buffer post-roll.</b> HA's
    <code>nvr_postroll_seconds</code> derives its post-roll tail from an already-running
    continuous pre-roll ring recorder (a stateful, long-running supervisor). That design
    doesn't fit this repo's stateless message-in/message-out flow-node model — this node
    is a simpler, event-triggered analogue: wire it directly to a motion/person event
    (e.g. from <b>bosch-camera-event</b>) to get a bounded clip starting at that moment.
    ffmpeg's codec/argv choices (<code>-c copy</code>, <code>-analyzeduration</code>/
    <code>-probesize 10M</code>, <code>-movflags +faststart</code>) mirror HA's Mini-NVR
    pre-roll ring so output files are consistent with what HA produces.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any message triggers a capture — the payload itself is not inspected.</dd>
        <dt class="optional">cameraId <span class="property-type">string</span></dt>
        <dd>Override the configured Camera ID at runtime.</dd>
        <dt class="optional">connectionType <span class="property-type">string</span></dt>
        <dd>Override the connection type at runtime (<code>'LOCAL'</code> or <code>'REMOTE'</code>).</dd>
        <dt class="optional">quality <span class="property-type">string</span></dt>
        <dd>Override the quality preference at runtime (<code>'auto'</code>, <code>'high'</code>, or <code>'low'</code>).</dd>
        <dt class="optional">seconds <span class="property-type">number</span></dt>
        <dd>Override the capture duration at runtime (1-60s, clamped).</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.cam <span class="property-type">string</span></dt>
        <dt>payload.file <span class="property-type">string</span></dt>
        <dd>Absolute path to the captured <code>.mp4</code> file.</dd>
        <dt>payload.seconds <span class="property-type">number</span></dt>
        <dt>payload.connectionType <span class="property-type">string</span></dt>
        <dt>payload.quality <span class="property-type">string</span></dt>
    </dl>

    <h3>Details</h3>
    <p>Only one capture runs per node instance at a time — a new trigger message while
    a capture is still running errors immediately instead of queueing or overlapping.</p>
    <p>Requires an <code>ffmpeg</code> binary reachable at <b>ffmpeg path</b> (default: on
    <code>PATH</code>). The output directory must exist and be writable by the Node-RED
    process — this node does not create it.</p>
    <p>Output files are named <code>postroll-&lt;cameraId&gt;-&lt;ISO-timestamp&gt;.mp4</code>
    inside <b>Output dir</b>.</p>
    <p>The node undeploying/redeploying mid-capture sends <code>SIGTERM</code>, escalating
    to <code>SIGKILL</code> after <b>Stop grace (ms)</b>, and always waits for ffmpeg to
    actually exit before Node-RED considers the node stopped.</p>
    <p>Stream URLs may embed Digest credentials in the userinfo component
    (<code>rtsp://user:pass@host/...</code>). The node <em>never</em> logs the raw URL —
    only a redacted form (<code>***:***@</code>) appears in node status and the log.</p>
</script>
